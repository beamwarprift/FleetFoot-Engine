name: Something does not work
description: A bug in FleetFoot Engine.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: How to see it again, one step per line. A public page where it happens helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FleetFoot Engine version
      description: On the options page, under About.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 142 on Android
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send it
      options:
        - label: I removed anything private from this report, such as addresses of private pages.
          required: true
